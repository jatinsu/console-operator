apiVersion: console.openshift.io/v1
kind: ConsoleQuickStart
metadata:
  annotations:
    capability.openshift.io/name: Console
    include.release.openshift.io/ibm-cloud-managed: 'true'
    include.release.openshift.io/self-managed-high-availability: 'true'
    include.release.openshift.io/single-node-developer: 'true'
  name: do-not-move
spec:
  accessReviewResources:
    - group: operators.coreos.com
      resource: operatorgroups
      verb: list
    - group: packages.operators.coreos.com
      resource: packagemanifests
      verb: list
  durationMinutes: 10
  displayName: DO NOT MOVE 
  description: >-
    DO NOT MOVE
  icon: >-
    data:image/svg+xml;base64,
  introduction: >-
    DO NOT MOVE
  tasks:
    - title: Install the ToolHive Operator
      description: >
        To install the **ToolHive Operator**:

        1. From the **Administrator** perspective, go to the **OperatorHub** from the [Operators]{{highlight qs-nav-operators}} section of the navigation.

        1. In the **Filter by keyword** field, type `toolhive`.

          **Note:** If the tile has an **Installed** label, the Operator is already installed. Proceed to the next task to create a ToolHive instance.

        1. Click the **ToolHive Operator** tile to open the Operator details.

        1. In the **ToolHive Operator** panel click **Install**.

        1. The **Install Operator** page opens with default values.

        1. Select the installation mode and namespace where you want to deploy ToolHive.

        1. Click **Install**. A page opens that shows the various installation steps and displays a message when the Operator is installed.

        1. Click **View Operator** to open the Operator details page.
      review:
        failedTaskHelp: >-
          This task is incomplete. Try the task again, or [read
          more](https://github.com/stacklok/toolhive/blob/main/docs/kubernetes-operator.md)
          about this topic.
        instructions: >-
          #### Verify that **ToolHive Operator** is installed:

            - From the **Administrator** perspective, go to **Installed Operators** from the [Operators]{{highlight qs-nav-operators}} section of the navigation.
            - The ToolHive Operator should be shown in the list of Operators
            - In the **Status** column, do you see the status of **ToolHive Operator** as **Succeeded**?

    - title: Create a ToolHive instance
      description: >
        To create a ToolHive instance:

        1. From the **Administrator** perspective, go to **Installed Operators** from the [Operators]{{highlight qs-nav-operators}} section of the navigation.

        1. From the **Project** list, select the OKD project where you want to deploy ToolHive.

        1. Click **ToolHive Operator** to open the Operator details.

        1. Click the **ToolHive** tab.

        1. Click **Create ToolHive**. A form with default values opens.

        1. Specify a name for the ToolHive instance.

          **Note:** The default configuration includes the Gateway, Registry Server, and Runtime components. You can customize these settings based on your requirements.

        1. Click **Create**.

      review:
        failedTaskHelp: >-
          This task isn't verified yet. Try the task again, or [read
          more](https://github.com/stacklok/toolhive/blob/main/docs/getting-started.md)
          about this topic.
        instructions: >
          #### Verify that your ToolHive instance has been created:

          From the **Administrator** perspective, go to **Installed Operators** from the [Operators]{{highlight qs-nav-operators}} section of the navigation.

          - Go to the ToolHive Operator and click the **ToolHive** tab.

          - Do you see the ToolHive instance in the list?

          - Click the ToolHive instance.

              - In the **Conditions** table, do you see the **Ready** type set to `True`?

          **Note:** It may take a few minutes for the ToolHive components to be fully deployed.

    - title: Access the ToolHive Portal
      description: >
        To access the ToolHive Portal and start managing MCP servers:

        1. From the **Administrator** perspective, go to **Installed Operators** from the [Operators]{{highlight qs-nav-operators}} section of the navigation.

        1. Click **ToolHive Operator** to open the Operator details.

        1. Click the **ToolHive** tab.

        1. Click on your ToolHive instance name to view its details.

        1. In the instance details, find the **Portal URL** field.

        1. Click on the Portal URL to open the ToolHive Portal in a new browser tab.

        1. The Portal provides a user-friendly interface for discovering and configuring MCP servers available in your ToolHive catalog.

      review:
        failedTaskHelp: >-
          This task isn't verified yet. Try the task again, or [read
          more](https://github.com/stacklok/toolhive/blob/main/docs/portal.md)
          about this topic.
        instructions: >
          #### Verify that you can access the ToolHive Portal:

          - Did a new browser tab open with the ToolHive Portal interface?

          - Can you see the ToolHive dashboard with available MCP servers?

    - title: Deploy your first MCP server
      description: >
        To deploy an MCP server using ToolHive:

        1. In the ToolHive Portal, navigate to the **Registry** section to browse available MCP servers.

        1. Select an MCP server from the catalog that you want to deploy.

        1. Click **Deploy** on the selected MCP server.

        1. Configure the deployment settings:

            - Choose the namespace where the server will be deployed
            - Configure any required environment variables or settings
            - Set up access policies and authentication if needed

        1. Click **Create Deployment**.

        1. Monitor the deployment status in the Portal. The MCP server will be deployed as a containerized workload in your cluster.

      review:
        failedTaskHelp: >-
          This task isn't verified yet. Try the task again, or [read
          more](https://github.com/stacklok/toolhive/blob/main/docs/deploying-servers.md)
          about this topic.
        instructions: >
          #### Verify that your MCP server has been deployed:

          - In the ToolHive Portal, go to the **Deployments** section.

          - Do you see your newly deployed MCP server in the list?

          - Is the server status showing as **Running**?

          **Alternatively**, from the **Administrator** perspective in OKD:

          - Go to **Workloads** > **Pods** from the navigation.

          - Do you see a pod for your MCP server with a **Running** status?

  conclusion: >-
    Your ToolHive operator has been installed and configured! You can now deploy and manage Model Context Protocol (MCP) servers across your OKD cluster.


    To learn more about ToolHive's features including the Gateway for access control, advanced server configurations, and integrating with AI clients, visit the [ToolHive documentation](https://github.com/stacklok/toolhive/blob/main/README.md).
